# Refreshes data/snapshot.json once a day: the star and fork counts, stars per
# day and the contributors the offline sky is drawn from. It commits only when
# the snapshot changed.
name: snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Take a new snapshot
        env:
          # The Actions token is refused on another repo's stargazers, so the
          # snapshot reads them with a read-only token kept as SNAPSHOT_TOKEN.
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          go run ./cmd/snapshot > snapshot.new.json
          # A failed or empty run must never replace the snapshot.
          python3 -c "import json,sys; d=json.load(open('snapshot.new.json')); assert d['stars'] > 0 and d['daily']"
          mv snapshot.new.json data/snapshot.json
          go build ./...
      - name: Commit when it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "snapshot unchanged"
            exit 0
          fi
          # The contents API commits as the Actions bot, so no git identity
          # is set here.
          # The file is far over the 128 KiB a single argument may hold, so
          # the request body goes in through a file.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/snapshot.json?ref=${GITHUB_REF_NAME}" --jq .sha)
          jq -n --arg sha "$sha" --arg branch "${GITHUB_REF_NAME}" \
            --rawfile raw data/snapshot.json \
            '{message: "data: refresh the snapshot", sha: $sha, branch: $branch, content: ($raw | @base64)}' > body.json
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/data/snapshot.json" --input body.json --jq .commit.sha
